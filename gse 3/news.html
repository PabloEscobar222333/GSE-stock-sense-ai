<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Market News — StockSense AI</title>
  <link rel="stylesheet" href="styles/main.css"/>
  <style>
    .news-layout { display:grid; grid-template-columns:200px 1fr; gap:24px; }
    .news-sidebar { display:flex; flex-direction:column; gap:6px; }
    .news-cat-btn { padding:9px 14px; border-radius:var(--radius-sm); font-size:13px; font-weight:500; cursor:pointer; color:var(--text-secondary); background:none; text-align:left; transition:all 0.2s ease; border:none; }
    .news-cat-btn:hover { color:var(--text-primary); background:rgba(255,255,255,0.04); }
    .news-cat-btn.active { color:var(--emerald); background:var(--emerald-glow); }

    .news-grid { display:flex; flex-direction:column; gap:16px; }
    .news-card  { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-md); padding:22px 24px; transition:border-color 0.2s ease; }
    .news-card:hover { border-color:var(--border-hover); }
    .news-card.bullish-card { border-left:3px solid var(--emerald); }
    .news-card.bearish-card { border-left:3px solid var(--red); }
    .news-card.neutral-card { border-left:3px solid var(--text-muted); }
    .news-card.macro-card   { border-left:3px solid var(--gold); }

    .nc-top { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:10px; flex-wrap:wrap; }
    .nc-tags { display:flex; gap:6px; flex-wrap:wrap; }
    .nc-meta { font-size:12px; color:var(--text-muted); white-space:nowrap; }
    .nc-headline { font-size:17px; font-weight:600; margin-bottom:10px; line-height:1.4; }
    .nc-ai { font-size:14px; color:var(--text-secondary); line-height:1.6; margin-bottom:12px; }
    .nc-bottom { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
    .nc-tickers { display:flex; gap:6px; flex-wrap:wrap; }
    .nc-ticker-tag { padding:3px 10px; border-radius:var(--radius-pill); background:rgba(255,255,255,0.05); border:1px solid var(--border); font-family:var(--font-data); font-size:11px; color:var(--text-secondary); }
    .nc-confidence { font-size:11px; letter-spacing:0.06em; text-transform:uppercase; font-weight:600; }
    .confidence-HIGH { color:var(--emerald); }
    .confidence-MEDIUM { color:var(--amber); }
    .confidence-LOW { color:var(--text-muted); }

    @media(max-width:768px) { .news-layout { grid-template-columns:1fr; } .news-sidebar { flex-direction:row; flex-wrap:wrap; } }
  </style>
</head>
<body>
<div class="app-layout">
  <div id="sidebarHolder"></div>
  <main class="main-content">
    <div class="topbar">
      <div class="topbar-left"><h2>Market News Monitor</h2><div class="topbar-sub">AI-tagged news impacting GSE stocks</div></div>
      <div class="topbar-right"><div class="usage-pill" data-usage-pill>3 of 5 free</div></div>
    </div>
    <div class="page-body">
      <div class="news-layout">
        <!-- Category sidebar -->
        <div class="news-sidebar">
          <div class="label" style="padding:4px 14px;margin-bottom:4px">Categories</div>
          <button class="news-cat-btn active" onclick="filterNews('ALL',this)">All Market News</button>
          <button class="news-cat-btn" onclick="filterNews('Ghana News',this)">Ghana News</button>
          <button class="news-cat-btn" onclick="filterNews('Global News',this)">Global News</button>
        </div>
        <!-- News feed -->
        <div class="news-grid" id="newsGrid"></div>
      </div>
    </div>
  </main>
  <div id="mobileNavHolder"></div>
</div>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
if (!Auth.requireAuth()) throw new Error();
initApp('news.html');
let currentCat = 'ALL';

function filterNews(cat, el) {
  currentCat = cat;
  document.querySelectorAll('.news-cat-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderNews();
}

function renderNews() {
  const items = currentCat === 'ALL' ? GSE.news : GSE.news.filter(n => n.category === currentCat);
  const grid = document.getElementById('newsGrid');
  if (!items || !items.length) { grid.innerHTML = `<div style="color:var(--text-muted);padding:32px;text-align:center">Fetching live news...</div>`; return; }

  grid.innerHTML = items.map(n => {
    const cardCls = n.direction === 'bullish' ? 'bullish-card' : n.direction === 'bearish' ? 'bearish-card' : n.impact === 'macro' ? 'macro-card' : 'neutral-card';
    const ts = new Date(n.timestamp);
    const timeStr = ts.toLocaleDateString('en-GH', { day:'numeric', month:'short', year:'numeric' }) + ' · ' + ts.toLocaleTimeString('en-GH', { hour:'2-digit', minute:'2-digit' });
    const tagHtml = n.tags.map(t => {
      const isB = t.startsWith('BULLISH');
      const isSe = t.startsWith('BEARISH');
      const isMac = t.startsWith('MACRO');
      const cls = isB ? 'badge-bullish' : isSe ? 'badge-bearish' : isMac ? 'badge-macro' : 'badge-neutral';
      return `<span class="badge ${cls}" style="font-size:10px">${t}</span>`;
    }).join('');

    return `<div class="news-card ${cardCls}">
      <div class="nc-top">
        <div class="nc-tags">${tagHtml}</div>
        <div class="nc-meta">${n.source} · ${timeStr}</div>
      </div>
      <div class="nc-headline">${n.headline}</div>
      <div class="nc-ai">${n.aiInterpretation}</div>
      <div class="nc-bottom">
        <div class="nc-tickers">${n.affectedTickers.map(t => `<span class="nc-ticker-tag">${t}</span>`).join('')}</div>
        <a href="${n.link}" target="_blank" style="color:var(--emerald);font-size:13px;font-weight:600;text-decoration:none">Read Full Article →</a>
      </div>
    </div>`;
  }).join('');
}

window.addEventListener('gseNewsUpdated', () => renderNews());
renderNews();
</script>
</body>
</html>
