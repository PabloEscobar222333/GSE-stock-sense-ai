<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Alerts — StockSense AI</title>
  <link rel="stylesheet" href="styles/main.css"/>
  <style>
    .alerts-layout { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
    .alert-card { background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-md);padding:18px 20px;display:flex;gap:14px;align-items:flex-start; }
    .alert-icon { width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0; }
    .alert-title  { font-size:15px;font-weight:600;margin-bottom:4px; }
    .alert-desc   { font-size:13px;color:var(--text-secondary);line-height:1.5; }
    .alert-time   { font-size:11px;color:var(--text-muted);margin-top:6px;font-family:var(--font-data); }
    .create-form  { background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-md);padding:24px;margin-bottom:24px; }
    .form-row     { display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px; }
    @media(max-width:768px) { .alerts-layout{grid-template-columns:1fr} .form-row{grid-template-columns:1fr} }
  </style>
</head>
<body>
<div class="app-layout">
  <div id="sidebarHolder"></div>
  <main class="main-content">
    <div class="topbar">
      <div class="topbar-left"><h2>Alert Centre</h2><div class="topbar-sub">RSI thresholds, MA crossovers, earnings watch</div></div>
      <div class="topbar-right"><div class="usage-pill" data-usage-pill></div></div>
    </div>
    <div class="page-body">
      <!-- Create Alert -->
      <div class="create-form">
        <h3 style="margin-bottom:16px">Create New Alert</h3>
        <div class="form-row">
          <div class="form-group" style="margin:0">
            <label class="form-label">Ticker</label>
            <input class="form-input" id="alertTicker" placeholder="e.g. MTNGH"/>
          </div>
          <div class="form-group" style="margin:0">
            <label class="form-label">Alert Type</label>
            <select class="form-input" id="alertType" style="cursor:pointer">
              <option value="RSI_ABOVE">RSI Above</option>
              <option value="RSI_BELOW">RSI Below</option>
              <option value="PRICE_ABOVE">Price Above</option>
              <option value="PRICE_BELOW">Price Below</option>
              <option value="SIGNAL_CHANGE">Signal Changes</option>
            </select>
          </div>
          <div class="form-group" style="margin:0">
            <label class="form-label">Threshold</label>
            <input class="form-input" id="alertThreshold" type="number" placeholder="e.g. 70"/>
          </div>
        </div>
        <button class="btn btn-emerald" onclick="createAlert()">Create Alert</button>
      </div>

      <!-- Active Alerts -->
      <div class="widget-header"><div class="widget-title">Active Alerts (<span id="alertCount">0</span>)</div></div>
      <div class="alerts-layout" id="alertsList"></div>
    </div>
  </main>
  <div id="mobileNavHolder"></div>
</div>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
if (!Auth.requireAuth()) throw new Error();
initApp('alerts.html');

let alerts = [];
try { alerts = JSON.parse(localStorage.getItem('gse_alerts')) || defaultAlerts(); } catch { alerts = defaultAlerts(); }

function defaultAlerts() {
  return [
    { id:1, ticker:'MTNGH', type:'RSI_ABOVE', threshold:70, active:true, created:'2026-03-14', triggered:false },
    { id:2, ticker:'GCB',   type:'RSI_BELOW', threshold:35, active:true, created:'2026-03-13', triggered:false },
    { id:3, ticker:'GOIL',  type:'PRICE_BELOW',threshold:5.00,active:true,created:'2026-03-12',triggered:false },
    { id:4, ticker:'ACCESS',type:'SIGNAL_CHANGE',threshold:0,active:true,created:'2026-03-10',triggered:true },
  ];
}

function saveAlerts() { localStorage.setItem('gse_alerts', JSON.stringify(alerts)); }

function createAlert() {
  const ticker = document.getElementById('alertTicker').value.trim().toUpperCase();
  const type   = document.getElementById('alertType').value;
  const thresh = parseFloat(document.getElementById('alertThreshold').value) || 0;
  if (!ticker) { Toast.show('error','Enter a ticker'); return; }
  if (!GSE.getStock(ticker)) { Toast.show('error',`${ticker} not found on GSE`); return; }
  alerts.unshift({ id: Date.now(), ticker, type, threshold:thresh, active:true, created:new Date().toISOString().split('T')[0], triggered:false });
  saveAlerts(); renderAlerts(); Toast.show('success', `Alert created for ${ticker}`);
}

function removeAlert(id) { alerts = alerts.filter(a => a.id !== id); saveAlerts(); renderAlerts(); }
function toggleAlert(id) { const a = alerts.find(x=>x.id===id); if(a) { a.active=!a.active; saveAlerts(); renderAlerts(); }}

function alertDesc(a) {
  const labels = { RSI_ABOVE:`RSI rises above ${a.threshold}`, RSI_BELOW:`RSI falls below ${a.threshold}`, PRICE_ABOVE:`Price rises above GHS ${a.threshold}`, PRICE_BELOW:`Price falls below GHS ${a.threshold}`, SIGNAL_CHANGE:'Signal changes (BUY/SELL/HOLD)' };
  return labels[a.type] || a.type;
}

function renderAlerts() {
  const el = document.getElementById('alertsList');
  document.getElementById('alertCount').textContent = alerts.length;
  if (!alerts.length) { el.innerHTML=`<div style="color:var(--text-muted);padding:24px;grid-column:1/-1">No alerts yet. Create one above.</div>`; return; }
  el.innerHTML = alerts.map(a => {
    const s = GSE.getStock(a.ticker);
    const iconColor = a.triggered ? 'var(--amber)' : a.active ? 'var(--emerald)' : 'var(--text-muted)';
    const iconBg    = a.triggered ? 'rgba(245,166,35,0.15)' : a.active ? 'var(--emerald-glow)' : 'rgba(255,255,255,0.04)';
    const statusLabel = a.triggered ? 'TRIGGERED' : a.active ? 'ACTIVE' : 'PAUSED';
    const statusColor = a.triggered ? 'var(--amber)' : a.active ? 'var(--emerald)' : 'var(--text-muted)';
    return `<div class="alert-card">
      <div class="alert-icon" style="background:${iconBg};color:${iconColor}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      </div>
      <div style="flex:1">
        <div class="alert-title">${a.ticker} · <span style="font-size:12px;font-weight:400;color:var(--text-secondary)">${alertDesc(a)}</span></div>
        <div class="alert-desc">${s ? s.name : ''}</div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">
          <div class="alert-time">Created ${a.created} · <span style="color:${statusColor};font-weight:600">${statusLabel}</span></div>
          <div style="display:flex;gap:6px">
            <button class="btn btn-sm" style="padding:4px 10px;font-size:11px;border:1px solid var(--border);border-radius:var(--radius-pill);color:var(--text-secondary)" onclick="toggleAlert(${a.id})">${a.active?'Pause':'Resume'}</button>
            <button class="btn btn-sm" style="padding:4px 10px;font-size:11px;border:1px solid rgba(255,69,96,0.3);border-radius:var(--radius-pill);color:var(--red)" onclick="removeAlert(${a.id})">Delete</button>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
}

renderAlerts();
</script>
</body>
</html>
