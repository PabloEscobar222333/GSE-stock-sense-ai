<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KOJO — AI Analyst Chat | StockSense AI</title>
  <link rel="stylesheet" href="styles/main.css"/>
  <style>
    .chat-layout { display:grid; grid-template-columns:1fr 280px; gap:20px; height:calc(100vh - var(--topbar-height) - 56px); }
    .chat-main   { display:flex; flex-direction:column; background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-md); overflow:hidden; }

    .chat-messages { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:16px; }

    .msg { display:flex; gap:12px; max-width:85%; animation:fadeUp 0.3s ease; }
    .msg.user  { flex-direction:row-reverse; align-self:flex-end; }
    .msg.ai    { align-self:flex-start; }

    .msg-avatar { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; flex-shrink:0; }
    .msg.ai .msg-avatar   { background:linear-gradient(135deg,var(--gold),var(--emerald)); color:var(--bg-deep); }
    .msg.user .msg-avatar { background:linear-gradient(135deg,var(--purple),var(--gold)); color:white; }

    .msg-bubble { padding:12px 16px; border-radius:16px; font-size:14px; line-height:1.6; }
    .msg.ai .msg-bubble   { background:rgba(255,255,255,0.06); border:1px solid var(--border); border-bottom-left-radius:4px; }
    .msg.user .msg-bubble { background:rgba(0,200,150,0.12); border:1px solid rgba(0,200,150,0.2); border-bottom-right-radius:4px; }

    /* Markdown-like rendering in bubble */
    .msg-bubble strong { color:var(--text-primary); font-weight:600; }
    .msg-bubble table  { width:100%; border-collapse:collapse; margin:8px 0; font-size:12px; }
    .msg-bubble th,
    .msg-bubble td     { padding:6px 10px; border:1px solid var(--border); text-align:left; }
    .msg-bubble th     { background:rgba(255,255,255,0.04); color:var(--text-muted); }

    /* Typing indicator */
    .typing-dots { display:flex; gap:4px; padding:14px 16px; background:rgba(255,255,255,0.06); border:1px solid var(--border); border-radius:16px; border-bottom-left-radius:4px; width:fit-content; }
    .typing-dot  { width:7px; height:7px; border-radius:50%; background:var(--text-muted); animation:typingBounce 1.2s infinite; }
    .typing-dot:nth-child(2) { animation-delay:0.2s; }
    .typing-dot:nth-child(3) { animation-delay:0.4s; }
    @keyframes typingBounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }

    /* Input area */
    .chat-input-area { padding:16px; border-top:1px solid var(--border); display:flex; gap:10px; }
    .chat-input { flex:1; padding:12px 16px; background:rgba(255,255,255,0.04); border:1px solid var(--border); border-radius:var(--radius-pill); color:var(--text-primary); font-size:14px; outline:none; font-family:var(--font-body); resize:none; max-height:100px; transition:border-color 0.2s; }
    .chat-input:focus { border-color:var(--emerald); }
    .chat-send { width:42px; height:42px; border-radius:50%; background:var(--emerald); color:var(--bg-deep); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all 0.2s; flex-shrink:0; align-self:flex-end; border:none; }
    .chat-send:hover { box-shadow:var(--shadow-glow-emerald); transform:scale(1.05); }

    /* Suggestions panel */
    .chat-suggestions { display:flex; flex-direction:column; gap:8px; }
    .suggestion-btn { padding:10px 14px; background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-sm); font-size:13px; color:var(--text-secondary); cursor:pointer; text-align:left; transition:all 0.2s; font-family:var(--font-body); }
    .suggestion-btn:hover { border-color:var(--emerald); color:var(--text-primary); background:var(--emerald-glow); }

    @media(max-width:1024px) { .chat-layout { grid-template-columns:1fr; } .chat-suggestions { display:none; } }
    @media(max-width:768px)  {
      .chat-layout { height:calc(100dvh - 56px - 72px); }
      .chat-input { font-size:16px; /* prevents iOS zoom */ }
      .chat-input-area { padding:12px; gap:8px; }
      .chat-send { width:46px; height:46px; } /* easier tap target */
      .msg { max-width:95%; }
    }
  </style>
</head>

<script src="js/market-data.js"></script>
<script src="js/data.js"></script>

<script>
if (!Auth.requireAuth()) throw new Error();
const user    = Auth.getSession() || {};
const profile = Profile.get() || { riskProfile:'moderate', capitalAmount:5000 };
const rules   = GSE.profileRules[profile.riskProfile] || GSE.profileRules.moderate;
const firstName = escapeHtml((user.name || 'Investor').split(' ')[0]);
initApp('chat.html');

const messagesEl = document.getElementById('chatMessages');
let waiting = false;

/* ── Session Memory ─────────────────────────────────────────────
   Tracks within-session context for personalised responses
──────────────────────────────────────────────────────────────── */
const memory = {
  discussedTickers: [],
  lastTicker: null,
  capitalMentioned: profile.capitalAmount || 5000,
  addTicker(t) { if (t && !this.discussedTickers.includes(t)) this.discussedTickers.push(t); this.lastTicker = t; },
};

/* ── Helpers ──────────────────────────────────────────────────── */
function scrollBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }

function addMsg(role, html) {
  const initials = role === 'user' ? escapeHtml((user.name||'U')[0].toUpperCase()) : 'KJ';
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = `
    <div class="msg-avatar">${initials}</div>
    <div class="msg-bubble">${html}</div>`;
  messagesEl.appendChild(div);
  scrollBottom();
  return div;
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'msg ai'; div.id = 'typing';
  div.innerHTML = `<div class="msg-avatar">KJ</div><div class="typing-dots"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`;
  messagesEl.appendChild(div); scrollBottom();
}
function hideTyping() { const t = document.getElementById('typing'); if(t) t.remove(); }

/* Pick one response at random from an array */
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

/* Canonical badge HTML */
function signalBadge(signal) {
  return signal==='BUY'?'<span class="badge badge-buy">BUY</span>':signal==='SELL'?'<span class="badge badge-sell">SELL</span>':'<span class="badge badge-hold">HOLD</span>';
}

/* Plain text version of an HTML reply (for conversation history) */
function htmlToText(html) {
  const d = document.createElement('div');
  d.innerHTML = html.replace(/<br\s*\/?>/gi, '\n').replace(/<\/(tr|li|p|div)>/gi, '\n');
  return d.textContent.replace(/[ \t]+/g, ' ').replace(/\n\s*\n\s*\n+/g, '\n\n').trim();
}

/* Tickers explicitly written in UPPERCASE in a message (avoids matching words like "total"/"access") */
function tickersIn(raw) {
  return [...new Set((raw.match(/\b[A-Z]{2,8}\b/g) || []).filter(t => GSE.getStock(t)))];
}

/* ── Safe Markdown → HTML for Gemini replies ──────────────────
   The text is HTML-escaped FIRST, so model output can never inject markup.
──────────────────────────────────────────────────────────────── */
function mdInline(t) {
  return t
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/__([^_]+)__/g, '<strong>$1</strong>')
    .replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\*)/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer" style="color:var(--emerald)">$1</a>')
    .replace(/\b(BUY|SELL|HOLD)\b(?![^<]*>)/g, m => signalBadge(m));
}

function renderMarkdown(md) {
  const lines = escapeHtml(md).replace(/\r\n/g, '\n').split('\n');
  const out = [];
  let list = null; // 'ul' | 'ol'
  const closeList = () => { if (list) { out.push(`</${list}>`); list = null; } };
  const splitRow = row => row.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];

    // Table: header row followed by a |---|---| separator
    if (/^\s*\|.*\|\s*$/.test(line) && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1])) {
      closeList();
      const head = splitRow(line);
      i += 2;
      const rows = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) { rows.push(splitRow(lines[i])); i++; }
      i--;
      out.push('<table><tr>' + head.map(h => `<th>${mdInline(h)}</th>`).join('') + '</tr>' +
        rows.map(r => '<tr>' + r.map(c => `<td>${mdInline(c)}</td>`).join('') + '</tr>').join('') + '</table>');
      continue;
    }

    const h = line.match(/^\s*#{1,6}\s+(.*)$/);
    if (h) { closeList(); out.push(`<div style="margin:6px 0 2px"><strong>${mdInline(h[1])}</strong></div>`); continue; }

    const ul = line.match(/^\s*[-*•]\s+(.*)$/);
    if (ul) { if (list !== 'ul') { closeList(); out.push('<ul style="margin:4px 0 4px 18px">'); list = 'ul'; } out.push(`<li>${mdInline(ul[1])}</li>`); continue; }

    const ol = line.match(/^\s*\d+[.)]\s+(.*)$/);
    if (ol) { if (list !== 'ol') { closeList(); out.push('<ol style="margin:4px 0 4px 18px">'); list = 'ol'; } out.push(`<li>${mdInline(ol[1])}</li>`); continue; }

    if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)) { closeList(); out.push('<hr style="border:none;border-top:1px solid var(--border);margin:8px 0">'); continue; }

    closeList();
    out.push(line.trim() ? mdInline(line) + '<br>' : '<br>');
  }
  closeList();
  return out.join('').replace(/(<br>){3,}/g, '<br><br>').replace(/^(<br>)+|(<br>)+$/g, '');
}

/* ═══════════════════════════════════════════════════════════════
   GEMINI — KOJO's live brain
═══════════════════════════════════════════════════════════════ */
const Gemini = {
  history: [],        // [{ role:'user'|'model', parts:[{text}] }]
  MAX_TURNS: 20,

  available() {
    const cfg = window.GSE_CONFIG || {};
    return !!(cfg.geminiApiKey && (cfg.geminiModels || []).length);
  },

  systemPrompt() {
    const m = GSE.macro;
    const stockLines = GSE.stocks.map(s =>
      [s.ticker, s.name, s.sector, s.price.toFixed(2), `${s.change}%`, s.rsi,
       s.sma50 ? s.sma50.toFixed(2) : '-', s.sma200 ? s.sma200.toFixed(2) : '-',
       GSE.fmtPct(s.ret3m), GSE.fmtPct(s.ret1y), s.volatility ?? '-', GSE.formatCap(s.marketCapValue),
       s.signal, s.score, s.noHistory ? 'NO-HISTORY' : s.thinlyTraded ? 'THIN' : 'ok'].join(' | ')
    ).join('\n');
    const news = (GSE.news || []).slice(0, 8).map(n => `- [${n.category}] ${n.headline} (${n.source}, ${String(n.timestamp).slice(0,10)})`).join('\n');

    return `You are KOJO, the AI analyst inside StockSense AI, an app for investors on the Ghana Stock Exchange (GSE).
Personality: warm, confident, plain-English, a little Ghanaian flavour (e.g. "Akwaaba", "Medaase") used sparingly. Be concise: usually under 180 words unless the user asks for depth.

Today is ${new Date().toDateString()}.

HARD RULES
- For prices, returns, RSI, averages, volatility, signals and scores, use ONLY the data below. Never invent numbers. If a ticker isn't listed, say you don't cover it.
- All indicators are computed from real GSE daily closing prices (price history up to ${GSE.snapshot.generatedAt ? GSE.snapshot.generatedAt.slice(0,10) : 'n/a'}, plus today's live price).
- The app has NO earnings, P/E, dividend or balance-sheet data. If asked about those, say so plainly and suggest checking the company's latest annual report or the GSE website — never estimate them.
- Signals come from these rules: SELL if RSI > 70, or price below both the 50- and 200-day averages with a 3-month fall over 10%. BUY if score ≥ 60, RSI ≤ 65 and price above its 50-day average. Otherwise HOLD. Stocks marked THIN rarely trade (price moved in under 10% of the last 60 sessions), are always HOLD, and are hard to buy or sell — mention that.
- When asked for picks or what to buy, only put forward BUY-signal stocks that fit the user's profile rules. If none fit, say so honestly and suggest which HOLD stocks to watch and why — never present a HOLD or SELL stock as a pick.
- Score (0–100) = trend 40 (price vs 50/200-day averages) + 3-month momentum 25 + RSI in 40–60 zone 15 + low volatility 10 + trading activity 10. It is a technical score, not a fundamental one.
- Allocation maths: amount = allocation% × capital; shares = floor(amount ÷ price). Never suggest more than ${rules.maxAllocationPct}% of capital in one stock for this user.
- This is educational information, not financial advice. When you give a buy/sell view, add a short one-line reminder (not every message).
- Stay on investing, personal finance, the Ghanaian economy and how to use this app. Politely steer other topics back.
- Format with simple Markdown only: **bold**, bullet lists, numbered lists, and small tables. No HTML. No code blocks.
- App pages you can point users to: Dashboard, Radar Scanner, Watchlist, Portfolio Allocator, Alerts, News Monitor, Settings.

USER
- Name: ${user.name || 'Investor'}
- Risk profile: ${rules.label} — ${rules.description}
- Rules: max ${rules.maxAllocationPct}% per stock, prefers RSI ≤ ${rules.maxRSI}, volatility ≤ ${rules.maxVolatility === 999 ? 'any' : rules.maxVolatility + '%'}${rules.allowSmallCaps ? '' : ', no small caps (under GHS 1B)'}
- Capital: GHS ${memory.capitalMentioned.toLocaleString()}
- Sectors of interest: ${(profile.sectors || []).join(', ') || 'not set'}
- Stocks discussed this session: ${memory.discussedTickers.join(', ') || 'none'}

GHANA MACRO (real data; "as of" dates in brackets)
BoG policy rate ${GSE.fmtNum(m.bogRate, 2, '', '%')} [${(m.meta.policyRate||{}).asOf || 'n/a'}], inflation ${GSE.fmtNum(m.inflation, 1, '', '%')} y/y [${(m.meta.inflation||{}).asOf || 'n/a'}], 91-day T-bill ${GSE.fmtNum(m.tbill91, 2, '', '%')} [${(m.meta.tbill91||{}).asOf || 'n/a'}] — source Bank of Ghana.
USD/GHS ${GSE.fmtNum(m.usdGhs, 4)} (day change ${m.usdGhsChange ?? 'n/a'}%; a rise means the cedi weakened) [${(m.meta.usdGhs||{}).asOf || 'n/a'}]; gold $${GSE.fmtNum(m.goldOz, 0)}/oz (day change ${m.goldChange ?? 'n/a'}%) [${(m.meta.goldOz||{}).asOf || 'n/a'}].
Cocoa $${GSE.fmtNum(m.cocoaTon, 0)}/t monthly average (${m.cocoaChange ?? 'n/a'}% m/m) [${(m.meta.cocoaTon||{}).asOf || 'n/a'}, IMF]; GDP growth ${GSE.fmtNum(m.gdpGrowth, 1, '', '%')} [${(m.meta.gdpGrowth||{}).asOf || 'n/a'}, World Bank annual].
If a figure is "—" it's unavailable — say so rather than guessing.

STOCKS (ticker | name | sector | price GHS | day change | RSI(14) | 50-day avg | 200-day avg | 3M return | 1Y return | annualised volatility % | market cap | signal | score /100 | liquidity)
${stockLines}

RECENT NEWS
${news || '- none loaded'}`;
  },

  push(role, text) {
    this.history.push({ role, parts: [{ text }] });
    if (this.history.length > this.MAX_TURNS * 2) this.history = this.history.slice(-this.MAX_TURNS * 2);
  },

  async callModel(model, body, timeoutMs) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeoutMs);
    try {
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-goog-api-key': window.GSE_CONFIG.geminiApiKey },
        body: JSON.stringify(body),
        signal: ctrl.signal,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const err = new Error((data.error && data.error.message) || `HTTP ${res.status}`);
        err.status = res.status;
        throw err;
      }
      const cand = (data.candidates || [])[0];
      const text = cand && cand.content && (cand.content.parts || [])
        .filter(p => typeof p.text === 'string' && !p.thought)
        .map(p => p.text).join('').trim();
      if (!text) {
        const err = new Error(`Empty response (${(cand && cand.finishReason) || (data.promptFeedback && data.promptFeedback.blockReason) || 'unknown'})`);
        err.status = 'empty';
        throw err;
      }
      return text;
    } catch (e) {
      if (e.name === 'AbortError') { const err = new Error('Request timed out'); err.status = 'timeout'; throw err; }
      throw e;
    } finally {
      clearTimeout(timer);
    }
  },

  // Returns the model's Markdown reply; throws if every model fails
  async ask(userText) {
    const cfg = window.GSE_CONFIG;
    const contents = [...this.history, { role: 'user', parts: [{ text: userText }] }];
    const body = {
      systemInstruction: { parts: [{ text: this.systemPrompt() }] },
      contents,
      generationConfig: { temperature: 0.6, maxOutputTokens: 2048 },
    };
    let lastErr;
    for (const model of cfg.geminiModels) {
      try {
        const text = await this.callModel(model, body, cfg.geminiTimeoutMs || 30000);
        this.push('user', userText);
        this.push('model', text);
        return text;
      } catch (e) {
        lastErr = e;
        console.warn(`Gemini ${model} failed:`, e.message);
        // Bad key / bad request won't be fixed by another model
        if (e.status === 400 || e.status === 401 || e.status === 403) break;
      }
    }
    throw lastErr || new Error('No Gemini model available');
  },
};

/* ── Call-to-action bridge endings ───────────────────────────── */
const CTAS = [
  'Want me to scan the market for you?',
  'Shall we look at a specific stock?',
  'Want to see your top picks based on your risk profile?',
  'Ready to run the radar scanner?',
  'Should I show you the best opportunities on the GSE right now?',
  'Want a full market scan tailored to your profile?',
];
function cta() { return `<br><br><em style="color:var(--text-muted)">${pick(CTAS)}</em>`; }

/* ── Stock report ────────────────────────────────────────────── */
function stockReport(s) {
  memory.addTicker(s.ticker);
  const alloc = GSE.calcAllocation(s.ticker, memory.capitalMentioned, profile.riskProfile);
  const rsiColor = s.rsi>70?'var(--red)':s.rsi<35?'var(--emerald)':'var(--text-primary)';
  const rsiVerdict = s.rsi>70?'overbought — tread carefully':s.rsi>55?'slightly elevated':'healthy entry zone';
  const signalRationale = s.thinlyTraded
    ? `This stock rarely trades, so it's hard to get in or out at a fair price. I don't give it an active signal.`
    : s.signal==='BUY'
    ? `It's trading above its 50-day average, RSI is in a ${rsiVerdict}, and it scores ${s.score}/100 on trend, momentum and stability.`
    : s.signal==='SELL'
    ? `${escapeHtml(s.signalReason)}. I'd wait for a pullback or a trend turn before considering entry.`
    : `${escapeHtml(s.signalReason)} — not a clear BUY or SELL, so it's one to monitor.`;

  return `${signalBadge(s.signal)} <strong>${s.ticker} — ${escapeHtml(s.name)}</strong><br><br>
    ${s.thinlyTraded ? '<em style="color:var(--amber)">⚠ Thinly traded: the price rarely changes, so buying or selling may take time.</em><br><br>' : ''}
    <table><tr><th>Metric</th><th>Value</th><th>Context</th></tr>
    <tr><td>Price</td><td>GHS ${s.price.toFixed(2)}</td><td>${s.change>0?`▲ +${s.change}%`:s.change<0?`▼ ${s.change}%`:'Unchanged'} today</td></tr>
    <tr><td>RSI</td><td style="color:${rsiColor}">${s.rsi}</td><td>${rsiVerdict}</td></tr>
    <tr><td>Trend</td><td>${s.sma50 ? (s.price > s.sma50 ? 'Above' : 'Below') + ' 50-day' : '—'}</td><td>${s.sma200 ? (s.price > s.sma200 ? 'above' : 'below') + ' 200-day average' : ''}</td></tr>
    <tr><td>3M / 1Y</td><td>${GSE.fmtPct(s.ret3m)} / ${GSE.fmtPct(s.ret1y)}</td><td>Price return</td></tr>
    <tr><td>Volatility</td><td>${s.volatility ?? '—'}%</td><td>${s.volatility === null ? '' : s.volatility < 25 ? 'Calm' : s.volatility < 50 ? 'Moderate swings' : 'Large swings'}</td></tr>
    <tr><td>Score</td><td>${s.score}/100</td><td>${s.score>=70?'Strong technicals':s.score>=50?'Mixed':'Weak'}</td></tr>
    <tr><td>Market Cap</td><td colspan="2">${GSE.formatCap(s.marketCapValue)}</td></tr>
    <tr><td>Sector</td><td colspan="2">${escapeHtml(s.sector)}</td></tr></table><br>
    <strong>My read:</strong> ${signalRationale}<br><br>
    ${alloc ? `<strong>For your ${rules.label} profile (GHS ${memory.capitalMentioned.toLocaleString()} capital):</strong> consider <strong style="color:var(--emerald)">GHS ${alloc.amount.toFixed(2)}</strong> — that gets you ~<strong>${alloc.shares} shares</strong>.` : ''}`;
}

/* ═══════════════════════════════════════════════════════════════
   KOJO OFFLINE INTENT ROUTER (used when Gemini is unavailable)
   Priority: specific finance intents → general conversation → fallback
═══════════════════════════════════════════════════════════════ */
function routeIntent(raw) {
  const t = raw.toLowerCase().trim();

  /* ── 1. GREETINGS ─────────────────────────────────────────── */
  if (/^(hi\b|hello\b|hey\b|howdy|yo\b|sup\b|what's up|wassup|how are you|how are you doing|how's it going|how do you do|ete sen|wo ho te sen|akwaaba|maakye|maaha|maadwo|ɛte sɛn)/i.test(t)) {
    const h = new Date().getHours();
    const gr = h<12?'morning':h<17?'afternoon':'evening';
    return pick([
      `Hey! Good to see you. Markets are moving today — ready to find your next opportunity?`,
      `Hello, ${firstName}! KOJO here, your GSE analyst. How can I help you make smarter moves today?`,
      `Akwaaba! 🤝 Great timing — there are some interesting signals on the GSE right now. What would you like to analyse?`,
      `Good ${gr}! I'm watching the markets closely. What's on your mind, ${firstName}?`,
      `Hey there! Always good to connect. Shall we talk stocks, or is there something else on your mind?`,
    ]);
  }

  /* ── 2. WHO IS KOJO ──────────────────────────────────────── */
  if (/who are you|what are you|are you human|are you a robot|are you ai|are you real|what is kojo|tell me about yourself|your name|introduce yourself/i.test(t)) {
    return `I'm <strong>KOJO</strong> — your AI-powered Ghana Stock Exchange analyst.
      Think of me as a Bloomberg terminal that actually talks to you like a person.<br><br>
      I can analyse the <strong>${GSE.stocks.length} stocks</strong> I track on the GSE, generate BUY/SELL/HOLD signals,
      tell you exactly how much to allocate based on your capital, track macro news,
      run a full market scan, and help you build a smarter portfolio.<br><br>
      Am I human? No. Am I better than most human analysts at 2am? Absolutely.<br><br>
      What would you like to explore?`;
  }

  /* ── 3. THANK YOU ─────────────────────────────────────────── */
  if (/thank you|thanks|thank u|\bthx\b|appreciate it|much appreciated|great job|well done|you're amazing|this is helpful|very helpful|you're good|you're the best|medaase|ɛda ase|ayekoo/i.test(t)) {
    return pick([
      `Always a pleasure! That's what I'm here for. Is there another stock you'd like me to look at?`,
      `Glad that helped! The market waits for no one — shall we keep going?`,
      `Medaase! 🙏 Let's keep finding you the best opportunities on the GSE.`,
      `That's what I'm here for. Now — want me to scan the full market for your next move?`,
    ]);
  }

  /* ── 4. FRUSTRATION ──────────────────────────────────────── */
  if (/this is useless|you're wrong|bad advice|i lost money|terrible|i don't understand|this is confusing|not helpful|rubbish|nonsense|you don't know|disappointed|this doesn't work|i'm frustrated|too complicated/i.test(t)) {
    return pick([
      `I hear you — investing can be genuinely frustrating, especially when markets are this volatile. Let me try again. Which part wasn't clear? I'll break it down differently.`,
      `Fair point — let me be more direct. Tell me specifically what you need and I'll give you a straight answer.`,
      `I'm sorry that wasn't helpful. My goal is to make this as clear as possible for you. What would you like me to explain differently?`,
      `Losing money is painful — I won't pretend otherwise. Let's take a step back and look at what the data is saying right now. Want to start fresh with a clean analysis?`,
    ]);
  }

  /* ── 5. COMPLIMENTS / FLIRTING / PLAYFULNESS ──────────────── */
  if (/i love you|you're beautiful|marry me|you're funny|\blol\b|\bhaha\b|you crack me up|you're cool|best app ever|i like you|can we date|are you single/i.test(t)) {
    return pick([
      `Ha! I appreciate the love — unfortunately I'm in a committed relationship with the Ghana Stock Exchange. But I can absolutely help you build wealth. Shall we?`,
      `You're too kind 😄 I'll take the compliment. Now — ready to find some winning stocks?`,
      `LOL — if I had feelings, I'd be flattered. For now, let's channel that energy into the markets. What are we analysing today?`,
    ]);
  }

  /* ── 6. BOREDOM / CASUAL ─────────────────────────────────── */
  if (/i'm bored|nothing to do|just chatting|just browsing|killing time|entertain me|talk to me/i.test(t)) {
    const top = GSE.getSignalStocks('BUY', profile.riskProfile)[0];
    return pick([
      top ? `Bored? Perfect timing. <strong>${top.ticker}</strong> is my top-scoring BUY for your profile right now (score ${top.score}/100, RSI ${top.rsi}, ${GSE.fmtPct(top.ret3m)} over 3 months). Want me to break it down?` : `Bored? Let's fix that — say <strong>'scan the market'</strong> and I'll show you what's moving.`,
      `I never get bored — there's always something moving on the GSE. Right now I'm seeing ${GSE.getSignalStocks('BUY', profile.riskProfile).length} active BUY signals for your profile. Curious?`,
    ]);
  }

  /* ── 7. CONFUSION / BEGINNER ─────────────────────────────── */
  if (/i don't know|not sure|where do i start|i'm new|i'm a beginner|how does this work|\bconfused\b|what should i do|guide me|i need help|teach me|i want to learn|explain to me/i.test(t)) {
    return pick([
      `No worries at all — everyone starts somewhere. Here's the simplest way to use me:<br><br>
      <strong>1.</strong> Tell me how much you want to invest<br>
      <strong>2.</strong> I check your risk profile (or ask a few quick questions)<br>
      <strong>3.</strong> I scan the market and tell you exactly which stocks to consider and how much to put in each<br><br>
      Want to start with step 1?`,
      `Let's keep it simple. Just tell me one of these:<br><br>
      → How much capital do you have to invest?<br>
      → Name a stock you've heard about<br>
      → Say <strong>'scan the market'</strong><br><br>
      I'll take it from there.`,
    ]);
  }

  /* ── 8. WEALTH / MONEY MINDSET ───────────────────────────── */
  if (/i want to be rich|make money|get rich|financial freedom|i need money|build wealth|passive income|retirement|save money|invest wisely|grow my money|double my money/i.test(t)) {
    return pick([
      `Smart thinking. The stock market is one of the most powerful wealth-building tools available. The key is patience, diversification, and buying at the right time.<br><br>
      Let me start with: how much capital do you have available to invest right now?`,
      `Financial freedom starts with one good decision. Let me help you make yours. Tell me your budget and I'll show you exactly where to start on the Ghana Stock Exchange.`,
      `The opportunity is real — but so is the risk if you don't know what you're doing. That's exactly why I exist.<br><br>How much are you working with, ${firstName}?`,
    ]);
  }

  /* ── 9. GHANA CONTEXT — CEDI / FOREX ─────────────────────── */
  if (/cedi|exchange rate|forex|dollar rate|usd.ghs/i.test(t)) {
    const m = GSE.macro;
    if (m.usdGhs === null) return `I don't have a current exchange rate loaded right now — try again in a moment.`;
    // USD/GHS going up = cedi weakening
    const c = m.usdGhsChange;
    const trend = c > 0 ? `weakened ${c}% against the dollar since the previous day` : c < 0 ? `strengthened ${Math.abs(c)}% against the dollar since the previous day` : 'held steady against the dollar';
    const impact = c > 0
      ? `A weaker cedi raises import costs and inflation pressure — watch fuel marketers like GOIL and TOTAL. Gold miners (AGA, ASG) earn in dollars, so they tend to benefit.`
      : `A steadier cedi eases imported inflation, which supports lower interest rates over time — generally helpful for banks like GCB and EGH and for consumer stocks.`;
    return `The cedi is at <strong>GHS ${GSE.fmtNum(m.usdGhs, 2)} per USD</strong> (reference rate, ${escapeHtml((m.meta.usdGhs || {}).asOf || '')}) — it has ${trend}.<br><br>${impact}<br><br>Want me to run a signal on any of those?`;
  }

  /* ── 10. GHANA CONTEXT — COCOA ───────────────────────────── */
  if (/\bcocoa\b/i.test(t)) {
    const m = GSE.macro;
    if (m.cocoaTon === null) return `I don't have a cocoa price loaded right now.`;
    const dir = m.cocoaChange === null ? '' : m.cocoaChange >= 0 ? `, up ${m.cocoaChange}% on the month before` : `, down ${Math.abs(m.cocoaChange)}% on the month before`;
    return `Cocoa averaged <strong>${GSE.fmtNum(m.cocoaTon, 0, '$')}/tonne</strong> in ${escapeHtml((m.meta.cocoaTon || {}).asOf || 'the latest month')}${dir} (IMF data).<br><br>
      On the GSE that matters most for <strong>CPC</strong> (Cocoa Processing Company), whose costs and margins track cocoa prices. <strong>BOPP</strong> is agriculture too, but palm oil, so it's less exposed.<br><br>
      Want me to run a quick signal on CPC or BOPP?`;
  }

  /* ── 11. GHANA CONTEXT — GOLD ────────────────────────────── */
  if (/\bgold\b/i.test(t)) {
    const m = GSE.macro;
    if (m.goldOz === null) return `I don't have a gold price loaded right now.`;
    return `Gold is at <strong>${GSE.fmtNum(m.goldOz, 0, '$')}/oz</strong>${m.goldChange !== null ? ` (${m.goldChange>0?'+':''}${m.goldChange}% on the day)` : ''}.<br><br>
      On the GSE that matters for the miners: <strong>AngloGold Ashanti (AGA)</strong>, <strong>Asante Gold (ASG)</strong>, and the gold-backed <strong>NewGold ETF (GLD)</strong>. Higher gold prices mean higher revenues and wider margins — though AGA and ASG trade rarely on the GSE.<br><br>
      Want me to run an analysis on any of them?`;
  }

  /* ── 12. GHANA GENERAL CONTEXT ───────────────────────────── */
  if (/\bghana\b|\baccra\b|\bkumasi\b|\btakoradi\b|\btamale\b|ghana economy|\bbog\b|mobile money|momo|galamsey/i.test(t) && !/bank of ghana|policy rate|interest rate/i.test(t)) {
    const m = GSE.macro;
    return `Ghana's economy is deeply tied to the GSE, so this is very relevant.<br><br>
      Right now, the key numbers for investors are:<br>
      📌 <strong>BoG policy rate ${GSE.fmtNum(m.bogRate, 2, '', '%')}</strong> and <strong>inflation ${GSE.fmtNum(m.inflation, 1, '', '%')}</strong> — together they drive borrowing costs and bank margins<br>
      📌 <strong>91-day T-bill ${GSE.fmtNum(m.tbill91, 2, '', '%')}</strong> — the risk-free alternative stocks have to beat<br>
      📌 <strong>Cedi at ${GSE.fmtNum(m.usdGhs, 2)}</strong> per USD<br>
      📌 <strong>Gold ${GSE.fmtNum(m.goldOz, 0, '$')}/oz, cocoa ${GSE.fmtNum(m.cocoaTon, 0, '$')}/t</strong> — key for mining and agro stocks<br><br>
      Want me to identify which GSE stocks benefit most from current conditions?`;
  }

  /* ── 13. PHILOSOPHICAL / EXISTENTIAL ─────────────────────── */
  if (/meaning of life|why are we here|what is money|is investing worth it|should i even bother|life is hard|is the market rigged|can i trust you|is this legit/i.test(t)) {
    return pick([
      `The meaning of life? Unclear. The meaning of compound returns over 10 years? Extremely clear. Let me show you.${cta()}`,
      `Is the market rigged? Sometimes it feels that way. But data, discipline and patience consistently outperform emotion. That's what I help with.${cta()}`,
      `Can you trust me? I read the numbers without panic or greed — but my signals are model estimates, not guarantees, and this isn't financial advice. Use me as one input alongside your own research.${cta()}`,
      `Investing isn't worth it if you're doing it blindly. It absolutely IS worth it when you have the right information. That's why you're here.${cta()}`,
    ]);
  }

  /* ── 14. COMPETITOR AI ───────────────────────────────────── */
  if (/chatgpt|\bgpt\b|copilot|other ai|better ai|why not use|compare ai/i.test(t)) {
    return pick([
      `General AI tools are generalists. I'm a specialist — built specifically for the Ghana Stock Exchange, Ghanaian macro conditions, and the Ghanaian investor. That focus is my advantage.${cta()}`,
    ]);
  }

  /* ── 15. GOODBYES ────────────────────────────────────────── */
  if (/\bbye\b|goodbye|see you|see you later|talk later|\bcya\b|i'm done|that's all|logging off|nante yie|yɛbɛhyia bio/i.test(t)) {
    return pick([
      `Take care, ${firstName}! Remember — the best time to analyse a stock is before everyone else does. Come back anytime.`,
      `Nante yie! 🤝 The market will still be here when you return. So will I.`,
      `See you soon. Keep watching the markets — the GSE never sleeps, and neither do my signals.`,
    ]);
  }

  /* ── 16. CURRENT EVENTS / NEWS ───────────────────────────── */
  if (/\bnews\b|what's happening|latest news|market news|economy news|budget|election|government|parliament/i.test(t)) {
    const headlines = (GSE.news || []).slice(0, 4).map(n => `📰 ${escapeHtml(n.headline)} <span style="color:var(--text-muted)">— ${escapeHtml(n.source)}</span>`).join('<br>');
    return `Here's what I'm tracking that affects the GSE right now:<br><br>
      ${headlines || 'No headlines loaded yet.'}<br><br>
      Open the <a href="news.html" style="color:var(--emerald)">News Monitor →</a> for the full feed.`;
  }

  /* ══════════════════════════════════════════════════════════
     FINANCE INTENTS
     ══════════════════════════════════════════════════════════ */

  /* ── RSI explanation ─────────────────────────────────────── */
  if (/what\s+is\s+rsi|explain rsi|rsi meaning|what does rsi mean/i.test(t)) {
    return `<strong>RSI — Relative Strength Index</strong> is a momentum indicator on a scale of 0–100.<br><br>
      • <strong style="color:var(--emerald)">RSI &lt; 30</strong> — Oversold. It can bounce, but in a downtrend it can keep falling — I wait for the price to get back above its 50-day average before calling BUY.<br>
      • <strong>RSI 40–60</strong> — Healthy, balanced momentum. My score rewards this zone.<br>
      • <strong style="color:var(--amber)">RSI 60–70</strong> — Getting stretched. I don't call BUY above 65.<br>
      • <strong style="color:var(--red)">RSI &gt; 70</strong> — Overbought. High reversal risk. I flag these as SELL.<br><br>
      I combine RSI with the 50- and 200-day moving averages, 3-month momentum, volatility and how often the stock trades — all calculated from real GSE daily closing prices. <em>Never use RSI alone — it's one input, not the whole story.</em><br><br>
      Want to see which stocks currently have the best setups?`;
  }

  /* ── Stock analysis via ticker ───────────────────────────── */
  // Explicit "analyse X" — report on X, or say we don't cover it
  const explicit = raw.match(/analy[sz](?:e|is|ing)?\s*(?:of|on|for)?[\s:]+([A-Za-z]{2,8})\b/i)
    || raw.match(/run\s+(?:a\s+)?(?:signal|analysis|report)\s+(?:on\s+)?([A-Za-z]{2,8})\b/i)
    || raw.match(/look(?:s)?\s+at\s+([A-Za-z]{2,8})\b/i);
  const SKIP_WORDS = /^(SHOULD|BUY|SELL|HOLD|WHAT|HOW|SHOW|SCAN|ALL|FOR|THE|AND|BEST|TOP|MY|NEWS|HELP|TEST|MARKET|STOCKS?|SHARES?|THIS|THAT|IT|THEM|ME)$/i;
  if (explicit && !SKIP_WORDS.test(explicit[1]) && !/should\s+i\s+buy/i.test(t) && !/^compare\b/i.test(t)) {
    const s = GSE.getStock(explicit[1]);
    if (s) return stockReport(s);
    return `I couldn't find <strong>${escapeHtml(explicit[1].toUpperCase())}</strong> on the GSE. Try: <code>MTNGH</code>, <code>GCB</code>, <code>ACCESS</code>, <code>GOIL</code>, <code>BOPP</code>, <code>EGH</code>, <code>TOTAL</code>.<br><br>Or type <strong>'scan the market'</strong> and I'll surface the best opportunities right now.`;
  }
  // "<TICKER> stock/share" or a bare ticker — only if it's a real ticker (so "dividend stocks" isn't a ticker)
  const named = raw.match(/\b([A-Za-z]{2,8})\s*(?:stock|share)s?\b/i);
  const bare  = raw.trim().match(/^([A-Za-z]{2,8})\??$/);
  for (const m of [named, bare]) {
    const s = m && GSE.getStock(m[1]);
    if (s) return stockReport(s);
  }

  /* ── Should I buy? ───────────────────────────────────────── */
  const buyMatch = raw.match(/should\s+i\s+buy\s+([A-Za-z]{2,8})/i);
  if (buyMatch) {
    const s = GSE.getStock(buyMatch[1].toUpperCase());
    if (!s) return `That ticker isn't on my radar. Try: MTNGH, GCB, ACCESS, GOIL, or EGH.`;
    memory.addTicker(s.ticker);
    const alloc = GSE.calcAllocation(s.ticker, memory.capitalMentioned, profile.riskProfile);
    return `${signalBadge(s.signal)} My signal for <strong>${s.ticker}</strong> is <strong>${s.signal}</strong>.<br><br>
      <strong>Why?</strong> ${escapeHtml(s.signalReason)}. RSI ${s.rsi}, ${GSE.fmtPct(s.ret3m)} over 3 months, volatility ${s.volatility ?? '—'}%, score ${s.score}/100.<br><br>
      ${s.signal==='BUY' && alloc
        ? `<strong>For your ${rules.label} profile:</strong> at GHS ${memory.capitalMentioned.toLocaleString()} capital, put in <strong style="color:var(--emerald)">GHS ${alloc.amount.toFixed(2)}</strong> (${alloc.pct}%) — gets you <strong>~${alloc.shares} shares</strong>.`
        : s.signal==='SELL'
        ? `<strong>My take:</strong> I'd hold off and wait for the trend or RSI to improve before entering.`
        : s.thinlyTraded
        ? `<strong>My take:</strong> It rarely trades, so getting in and out could be slow. Not an active pick.`
        : `<strong>My take:</strong> Not a strong entry right now. Monitor it — a move back above its 50-day average with RSI under 65 would turn it into a BUY.`}<br><br>
      <em style="color:var(--text-muted)">Educational information, not financial advice.</em>`;
  }

  /* ── Top picks ───────────────────────────────────────────── */
  if (/top\s+picks?|best\s+picks?|today.s?\s+(picks?|signals?)|best\s+stocks?\s+now/i.test(t)) {
    const picks = GSE.getSignalStocks('BUY', profile.riskProfile).slice(0,5);
    if (!picks.length) return `No BUY signals currently match your ${rules.label} profile rules. Want me to show the HOLD list instead?`;
    return `<strong>Top ${picks.length} BUY Picks — ${rules.label} Profile</strong><br><br>` +
      picks.map((s,i) => `<strong>${i+1}. ${s.ticker}</strong> — GHS ${s.price.toFixed(2)} · RSI ${s.rsi} · 3M ${GSE.fmtPct(s.ret3m)} · Score ${s.score}/100`).join('<br>') +
      `<br><br><em>All filtered for RSI ≤ ${rules.maxRSI}${rules.maxVolatility < 999 ? `, volatility ≤ ${rules.maxVolatility}%` : ''}${rules.allowSmallCaps ? '' : ', no small caps'} to match your ${rules.label} profile.</em><br><br>Want a deep-dive on any of these?`;
  }

  /* ── Sell warnings ───────────────────────────────────────── */
  if (/sell\s+warn|overbought|stocks?\s+to\s+avoid|\bavoid\b/i.test(t)) {
    const warns = GSE.stocks.filter(s => s.signal==='SELL' || s.rsi>70).sort((a,b) => b.rsi-a.rsi);
    return `<strong>Sell Warnings — Overbought / Risky Stocks:</strong><br><br>` +
      warns.slice(0,5).map(s => `⚠ <strong>${s.ticker}</strong> — RSI ${s.rsi} · ${signalBadge(s.signal)} · GHS ${s.price.toFixed(2)}`).join('<br>') +
      `<br><br>These stocks have elevated RSI and may be due for a pullback. I'd avoid new positions until RSI cools below 65.<br><br>Want me to find the opposite — stocks at low RSI with BUY signals?`;
  }

  /* ── Scan the market ─────────────────────────────────────── */
  if (/scan\s+the\s+market|market\s+scan|full\s+scan|scan\s+all/i.test(t)) {
    const buys = GSE.getSignalStocks('BUY', profile.riskProfile).slice(0,5);
    return `<strong>Market Scan — Top Opportunities for ${rules.label} Profile:</strong><br><br>` +
      (buys.map(s => `● <strong>${s.ticker}</strong> — ${signalBadge(s.signal)} RSI ${s.rsi} · GHS ${s.price.toFixed(2)} · Score ${s.score}`).join('<br>') || 'No BUY signals match your profile right now.') +
      `<br><br>Open the <a href="scanner.html" style="color:var(--emerald)">Radar Scanner →</a> for the full visual sweep of all ${GSE.stocks.length} stocks.<br><br>Want a detailed breakdown of any of these?`;
  }

  /* ── Macro / economy / BoG / interest rate / inflation ───── */
  if (/macro|\beconomy\b|interest\s+rate|\binflation\b|bog\s+rate|policy\s+rate|bank\s+of\s+ghana|monetary\s+policy/i.test(t)) {
    const m = GSE.macro, meta = m.meta || {};
    const chg = (v, unit) => v === null || v === undefined ? '—' : `${v>0?'+':''}${v}${unit}`;
    const when = k => escapeHtml((meta[k] || {}).asOf || '—');
    const realRate = m.tbill91 !== null && m.inflation !== null ? +(m.tbill91 - m.inflation).toFixed(2) : null;
    return `<strong>Ghana Macro Snapshot</strong><br><br>
      <table><tr><th>Indicator</th><th>Value</th><th>Change</th><th>As of</th></tr>
      <tr><td>BoG Policy Rate</td><td>${GSE.fmtNum(m.bogRate, 2, '', '%')}</td><td>${chg(m.bogChange, ' pts')}</td><td>${when('policyRate')}</td></tr>
      <tr><td>Inflation (y/y)</td><td>${GSE.fmtNum(m.inflation, 1, '', '%')}</td><td>${chg(m.inflationChange, ' pts')}</td><td>${when('inflation')}</td></tr>
      <tr><td>91-Day T-Bill</td><td>${GSE.fmtNum(m.tbill91, 2, '', '%')}</td><td>—</td><td>${when('tbill91')}</td></tr>
      <tr><td>USD / GHS</td><td>${GSE.fmtNum(m.usdGhs, 2)}</td><td>${chg(m.usdGhsChange, '%')}</td><td>${when('usdGhs')}</td></tr>
      <tr><td>Gold ($/oz)</td><td>${GSE.fmtNum(m.goldOz, 0, '$')}</td><td>${chg(m.goldChange, '%')}</td><td>${when('goldOz')}</td></tr>
      <tr><td>Cocoa ($/t)</td><td>${GSE.fmtNum(m.cocoaTon, 0, '$')}</td><td>${chg(m.cocoaChange, '% m/m')}</td><td>${when('cocoaTon')}</td></tr>
      <tr><td>GDP growth</td><td>${GSE.fmtNum(m.gdpGrowth, 1, '', '%')}</td><td>—</td><td>${when('gdpGrowth')}</td></tr></table><br>
      ${realRate !== null ? `<strong>KOJO's view:</strong> the 91-day T-bill pays ${realRate >= 0 ? `${realRate} pts above` : `${Math.abs(realRate)} pts below`} inflation, so ${realRate >= 0 ? 'safe cash earns a real return — stocks need to clear that bar' : 'cash loses value in real terms, which pushes investors toward assets like stocks'}.<br><br>` : ''}
      <em style="color:var(--text-muted);font-size:12px">Sources: Bank of Ghana, currency-api, IMF via FRED, World Bank.</em>`;
  }

  /* ── My risk profile ─────────────────────────────────────── */
  if (/my\s+(risk\s*)?profile|risk\s+appetite|my\s+score|what\s+(type|kind)\s+of\s+investor/i.test(t)) {
    return `<strong>Your Investor Profile: ${rules.label}</strong><br><br>
      ${rules.description}<br><br>
      • Max allocation per stock: <strong>${rules.maxAllocationPct}%</strong><br>
      • RSI threshold: <strong>≤ ${rules.maxRSI}</strong><br>
      • Capital on file: <strong>GHS ${memory.capitalMentioned.toLocaleString()}</strong><br>
      • Your top picks: ${GSE.topPicks(profile.riskProfile, 4).map(t=>`<strong>${t}</strong>`).join(', ') || 'none right now'}<br><br>
      <a href="onboarding.html" style="color:var(--gold)">Retake your profile survey →</a><br><br>
      Want me to show your personalised top picks right now?`;
  }

  /* ── Dividends ───────────────────────────────────────────── */
  if (/dividend/i.test(t)) {
    const steady = GSE.stocks.filter(s => s.marketCap !== 'small' && !s.thinlyTraded && s.volatility !== null).sort((a,b) => a.volatility - b.volatility).slice(0,5);
    return `I don't have dividend data — only real price history — so I can't rank stocks by yield. Check each company's latest annual report or the GSE website for dividend announcements.<br><br>
      If you want <strong>steady</strong> holdings while you research income, these larger stocks have had the calmest prices lately:<br><br>` +
      steady.map(s => `● <strong>${s.ticker}</strong> — volatility ${s.volatility}% · 1Y ${GSE.fmtPct(s.ret1y)} · ${signalBadge(s.signal)}`).join('<br>');
  }

  /* ── Compare ─────────────────────────────────────────────── */
  const compareMatch = raw.match(/compare\s+([A-Za-z]{2,8})\s+(?:and|vs\.?|versus|with)\s+([A-Za-z]{2,8})/i);
  if (compareMatch) {
    const s1 = GSE.getStock(compareMatch[1].toUpperCase());
    const s2 = GSE.getStock(compareMatch[2].toUpperCase());
    if (!s1 || !s2) return `One or both tickers not found. Try: MTNGH, GCB, ACCESS, GOIL.`;
    memory.addTicker(s1.ticker); memory.addTicker(s2.ticker);
    const winner = s1.score >= s2.score ? s1 : s2;
    const betterEntry = s1.rsi < s2.rsi ? s1 : s2;
    return `<strong>${s1.ticker} vs ${s2.ticker}</strong><br><br>
      <table><tr><th>Metric</th><th>${s1.ticker}</th><th>${s2.ticker}</th></tr>
      <tr><td>Price</td><td>GHS ${s1.price.toFixed(2)}</td><td>GHS ${s2.price.toFixed(2)}</td></tr>
      <tr><td>RSI</td><td>${s1.rsi}</td><td>${s2.rsi}</td></tr>
      <tr><td>3M Return</td><td>${GSE.fmtPct(s1.ret3m)}</td><td>${GSE.fmtPct(s2.ret3m)}</td></tr>
      <tr><td>1Y Return</td><td>${GSE.fmtPct(s1.ret1y)}</td><td>${GSE.fmtPct(s2.ret1y)}</td></tr>
      <tr><td>Volatility</td><td>${s1.volatility ?? '—'}%</td><td>${s2.volatility ?? '—'}%</td></tr>
      <tr><td>Market Cap</td><td>${GSE.formatCap(s1.marketCapValue)}</td><td>${GSE.formatCap(s2.marketCapValue)}</td></tr>
      <tr><td>Signal</td><td>${s1.signal}</td><td>${s2.signal}</td></tr>
      <tr><td>Score</td><td>${s1.score}/100</td><td>${s2.score}/100</td></tr></table><br>
      <strong>My verdict:</strong> <strong>${winner.ticker}</strong> has the stronger technical score. <strong>${betterEntry.ticker}</strong> offers the better entry point right now based on RSI.<br><br>
      Want a full deep-dive on either?`;
  }

  /* ── How much to invest? ─────────────────────────────────── */
  const allocMatch = raw.match(/how\s+much\s+(?:should\s+i\s+invest|to\s+invest)\s+in\s+([A-Za-z]{2,8})/i)
    || raw.match(/allocat[ei](?:on)?\s+(?:for\s+)?([A-Za-z]{2,8})/i);
  if (allocMatch) {
    const tk  = (allocMatch[1] || '').toUpperCase();
    const s   = GSE.getStock(tk);
    if (!s) return `That ticker isn't on my radar. Try: MTNGH, GCB, ACCESS, GOIL.`;
    memory.addTicker(tk);
    const alloc = GSE.calcAllocation(tk, memory.capitalMentioned, profile.riskProfile);
    if (!alloc) return `Could not calculate allocation for ${tk}.`;
    return `<strong>Portfolio Allocation: ${tk}</strong><br><br>
      • Your capital: <strong>GHS ${alloc.capital.toLocaleString()}</strong><br>
      • Risk profile: <strong>${rules.label}</strong><br>
      • Suggested allocation: <strong>${alloc.pct}%</strong><br>
      • Amount to invest: <strong style="color:var(--emerald)">GHS ${alloc.amount.toFixed(2)}</strong><br>
      • Shares you can buy: <strong>~${alloc.shares} shares</strong> at GHS ${alloc.pricePerShare.toFixed(2)}/share<br><br>
      <em>Never put more than ${rules.maxAllocationPct}% in one stock. Spread across 6–10 positions for ${rules.label.toLowerCase()} investors.</em><br><br>
      Want me to build a full diversified portfolio with your GHS ${alloc.capital.toLocaleString()}?`;
  }

  /* ── Lowest risk stocks ──────────────────────────────────── */
  if (/lowest\s+risk|safest?\s+stocks?|safe\s+stocks?|conservative\s+picks?/i.test(t)) {
    const safe = GSE.stocks.filter(s => s.signal !== 'SELL' && s.marketCap !== 'small' && !s.thinlyTraded && s.volatility !== null).sort((a,b)=>a.volatility-b.volatility).slice(0,5);
    return `<strong>Lowest-Risk Stocks Right Now:</strong><br><br>` +
      (safe.map(s => `● <strong>${s.ticker}</strong> — volatility ${s.volatility}% · ${signalBadge(s.signal)} · Score ${s.score}/100 · GHS ${s.price.toFixed(2)}`).join('<br>') || 'None match right now.') +
      `<br><br>These are larger, regularly traded stocks with the calmest recent price moves — a steadier base for a lower-risk position.<br><br>Want allocation numbers for any of these based on your GHS ${memory.capitalMentioned.toLocaleString()}?`;
  }

  /* ── Help ────────────────────────────────────────────────── */
  if (/^\bhelp\b$|what can you do|what do you know|how do i use/i.test(t)) {
    return `Here's what I can do for you, ${firstName}:<br><br>
      • <strong>Analyse [TICKER]</strong> — full signal report on any GSE stock I track<br>
      • <strong>Should I buy [TICKER]?</strong> — personalised buy/hold verdict<br>
      • <strong>Top picks today</strong> — best current BUY opportunities<br>
      • <strong>Sell warnings</strong> — overbought stocks to avoid<br>
      • <strong>Scan the market</strong> — full market sweep<br>
      • <strong>Compare GCB and MTNGH</strong> — side-by-side analysis<br>
      • <strong>How much should I invest in ACCESS?</strong> — GHS allocation<br>
      • <strong>Macro view</strong> — Ghana economic snapshot<br>
      • <strong>What is RSI?</strong> — plain-English explanations<br>
      • <strong>My risk profile</strong> — review your investor profile<br><br>
      Where would you like to start?`;
  }

  /* ── Gibberish / test ────────────────────────────────────── */
  if (/^[^a-z]{0,3}$|^(test|asdf|qwerty|123|\?{2,}|\!{2,})/i.test(t)) {
    return `Testing me? Fair enough — I'm ready. Ask me anything about the stocks on the Ghana Stock Exchange and let's see what I've got.`;
  }

  /* ── Fallback ────────────────────────────────────────────── */
  return `I'm not quite sure what you mean — but I'm built for the Ghana Stock Exchange. Try:<br><br>
    • A stock ticker: <strong>'Analyse MTNGH'</strong><br>
    • A question: <strong>'Should I buy GCB?'</strong><br>
    • A command: <strong>'Scan the market'</strong><br>
    • Or just say <strong>'help'</strong> and I'll walk you through everything.`;
}

/* ── Chat message flow ─────────────────────────────────────── */
let offlineNoticeShown = false;

async function sendMessage() {
  if (waiting) return;
  const input = document.getElementById('chatInput');
  const text  = input.value.trim();
  if (!text) return;

  tickersIn(text).forEach(t => memory.addTicker(t));
  addMsg('user', escapeHtml(text).replace(/\n/g, '<br>'));
  input.value = '';
  input.style.height = 'auto';
  waiting = true;
  document.getElementById('sendBtn').disabled = true;
  showTyping();

  let html;
  try {
    if (!Gemini.available()) throw new Error('Gemini not configured');
    const reply = await Gemini.ask(text);
    html = renderMarkdown(reply);
  } catch (err) {
    console.warn('Using offline KOJO:', err.message);
    // Small pause so the offline reply doesn't feel instant/robotic
    await new Promise(r => setTimeout(r, 500 + Math.random() * 500));
    html = routeIntent(text);
    // Keep Gemini's history in sync so the conversation still makes sense when it comes back
    Gemini.push('user', text);
    Gemini.push('model', htmlToText(html));
    if (!offlineNoticeShown) {
      offlineNoticeShown = true;
      html += `<br><br><em style="color:var(--text-muted);font-size:12px">(KOJO's live AI is unavailable right now — answering in offline mode.)</em>`;
    }
  }

  hideTyping();
  addMsg('ai', html);
  waiting = false;
  document.getElementById('sendBtn').disabled = false;
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  e.target.style.height = 'auto';
  e.target.style.height = Math.min(e.target.scrollHeight, 100) + 'px';
}

function setInput(text) {
  document.getElementById('chatInput').value = text;
  document.getElementById('chatInput').focus();
}

/* ── Welcome message ─────────────────────────────────────── */
const _h = new Date().getHours();
const _gr = _h<12?'morning':_h<17?'afternoon':'evening';
addMsg('ai', `Good ${_gr}, <strong>${firstName}</strong>. I'm <strong>KOJO</strong>, your GSE AI analyst.<br><br>
  Ask me to <strong>analyse any stock</strong>, <strong>scan the market</strong>,
  get <strong>exact allocation amounts</strong>, or <strong>explain any concept</strong> in plain English.<br><br>
  I'm here to help you make smarter moves on the Ghana Stock Exchange.
  What's on your mind?`);

/* ── Prompt handed over from another page (e.g. Watchlist → "Analyse") ── */
(function handleChatInit() {
  let init = null;
  try { init = sessionStorage.getItem('chatInit'); sessionStorage.removeItem('chatInit'); } catch {}
  if (!init) return;
  setInput(init);
  // Give live prices up to 3s to arrive so the first answer isn't based on seed data
  let sent = false;
  const send = () => { if (!sent) { sent = true; sendMessage(); } };
  if (GSE.liveLoaded) return send();
  window.addEventListener('gseDataUpdated', send, { once: true });
  setTimeout(send, 3000);
})();
</script>
